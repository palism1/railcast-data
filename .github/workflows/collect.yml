# FILE MAP
#   purpose: every 5 minutes, fetch MTA + NJT GTFS-RT with palism1/railcast and commit the snapshot
#   sections:
#     L8-24  Triggers
#     L26-94  Job
# END FILE MAP

# == Triggers ==
name: collect
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and report, but commit nothing"
        type: boolean
        default: true
  # TWEAK: 5 minutes is GitHub's floor; runs often start a few minutes late.
  schedule:
    - cron: "*/5 * * * *"

# DO NOT TOUCH: runs must never overlap, or two pushes race on the same files.
concurrency:
  group: collect
  cancel-in-progress: false

# == Job ==
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: palism1/railcast
          ref: main
          path: code
      # uv: installs Python and railcast's locked dependencies, cached between runs.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: code/uv.lock
      - run: uv sync --locked --project code --no-dev

      - name: Restore NJT token cache (encrypted)
        uses: actions/cache/restore@v4
        with:
          path: .njt-cache
          key: njt-token-${{ github.run_id }}
          restore-keys: njt-token-

      - name: Collect
        id: collect
        env:
          NJT_USERNAME: ${{ secrets.NJT_USERNAME }}
          NJT_PASSWORD: ${{ secrets.NJT_PASSWORD }}
        run: |
          uv run --project code --no-dev railcast-collect --out . --njt-cache .njt-cache/token.bin \
            $([ "$DRY_RUN" = "true" ] && echo --dry-run)

      - name: Save NJT token cache
        if: steps.collect.outputs.njt_cache_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .njt-cache
          key: njt-token-${{ github.run_id }}

      - name: Commit snapshot
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "railcast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A . (not a path list): a missing path, e.g. no parquet when every feed is down,
          # would make git add fail and drop that run's uptime rows.
          git add -A .
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git push -q && exit 0
            sleep $((2 ** i)); git pull -q --rebase
          done
          exit 1

      - name: Fail if every feed failed
        if: steps.collect.outputs.all_failed == 'true'
        run: echo "::error::every attempted feed failed this run" && exit 1
